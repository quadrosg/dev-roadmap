<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posts App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 760px;
        margin: 40px auto;
        padding: 0 16px;
      }

      .linha {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      input,
      button {
        font-size: 16px;
        padding: 10px;
      }

      input {
        flex: 1;
      }

      article {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }

      h2 {
        font-size: 18px;
        margin: 0 0 8px;
      }

      p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>Posts da API</h1>
    <div class="linha">
      <button id="botao-buscar">Buscar posts</button>
      <input id="campo-filtro" type="text" placeholder="Filtrar por titulo" />
    </div>
    <div id="mensagem">Nenhum post carregado ainda</div>
    <section id="lista-posts"></section>

    <script src="./posts-app.js"></script>
  </body>
</html>
