<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout em duas colunas</title>
    <link rel="stylesheet" href="./layout-duas-colunas.css" />
  </head>
  <body>
    <header class="topo">
      <h1>Layout em duas colunas</h1>
      <p>Vamos usar Flexbox para separar conteudo principal e barra lateral.</p>
    </header>

    <main class="pagina">
      <section class="conteudo">
        <h2>Conteudo principal</h2>
        <p>
          Esta area representa a parte mais importante da pagina, como artigos
          ou explicacoes principais.
        </p>
      </section>

      <aside class="lateral">
        <h2>Barra lateral</h2>
        <p>Esta area pode trazer links, dicas ou informacoes complementares.</p>
      </aside>
    </main>
  </body>
</html>
