<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario em TypeScript</title>
    <link rel="stylesheet" href="./formulario-ts.css" />
    <script src="./dist/formulario-ts.js" defer></script>
  </head>
  <body>
    <main class="pagina">
      <section class="card">
        <h1>Formulario com validacao</h1>
        <p>Mini app para praticar HTML, CSS e TypeScript juntos.</p>

        <form id="formulario-contato">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" />

          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem"></textarea>

          <button type="submit">Enviar</button>
        </form>

        <p id="resultado"></p>
      </section>
    </main>
  </body>
</html>
