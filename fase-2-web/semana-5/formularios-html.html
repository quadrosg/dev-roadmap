<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formularios HTML</title>
  </head>
  <body>
    <header>
      <h1>Formulario de teste</h1>
      <p>Exercicio teste para praticar os elementos principais de um formulario HTML.</p>
    </header>

    <main>
      <section>
        <h2>Entre em contato</h2>

        <form>
          <label for="nome_teste">Nome teste</label>
          <input id="nome_teste" name="nome" type="text" />

          <label for="email_teste">Email teste</label>
          <input id="email_teste" name="email" type="email" />

          <label for="assunto_teste">Assunto teste</label>
          <input id="assunto_teste" name="assunto" type="text" />

          <label for="mensagem_teste">Mensagem teste</label>
          <textarea id="mensagem_teste" name="mensagem"></textarea>

          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>
  </body>
</html>
