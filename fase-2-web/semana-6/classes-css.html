<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classes no CSS</title>
    <link rel="stylesheet" href="./classes-css.css" />
  </head>
  <body>
    <header class="topo">
      <h1 class="titulo-principal">Praticando classes no CSS</h1>
      <p class="descricao">
        Agora vamos estilizar elementos especificos sem depender apenas da tag.
      </p>
    </header>

    <main>
      <section class="card">
        <h2 class="subtitulo">Primeiro bloco</h2>
        <p class="texto">
          Este bloco existe para testar uma classe aplicada em uma secao.
        </p>
      </section>

      <section class="card destaque">
        <h2 class="subtitulo">Segundo bloco</h2>
        <p class="texto">
          Este bloco tambem tem a classe destaque para ficar diferente.
        </p>
      </section>
    </main>
  </body>
</html>
